<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM-BOK · Explorador</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#172033}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:620px;background:#fff;border:1px solid #d9e1ea;border-radius:16px;padding:28px;box-shadow:0 15px 45px rgba(15,36,62,.1)}.spin{width:42px;height:42px;border:4px solid #d9e1ea;border-top-color:#1f4e78;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{color:#1f4e78}</style></head><body><div class="loading"><div class="box"><div class="spin"></div><h2>Cargando explorador MM-BOK</h2><p>Se está reconstruyendo la visualización interactiva del Multimedia Engineering Body of Knowledge.</p></div></div><script>(async()=>{try{const paths=['assets/data/sankey-p1.txt','assets/data/sankey-p2.txt','assets/data/sankey-p3.txt','assets/data/sankey-p4.txt'];const parts=await Promise.all(paths.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error('No se pudo cargar '+p);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('El navegador no soporta descompresión gzip nativa.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><h2>No fue posible cargar el explorador</h2><p>'+e.message+'</p><p><a href="index.html">Volver al inicio</a></p></div></div>';console.error(e)}})();</script></body></html>
